    var grp=groups[g],exs=EXERCISE_DB[grp];
    content+='<div class="exPickCat"><div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'" style="cursor:pointer;padding:10px 0;border-bottom:1px solid var(--borderS);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.1em;font-family:var(--mono)">'+grp.toUpperCase()+'</span><span style="font-size:9px;color:var(--dm)">'+exs.length+' \u25bc</span></div><div class="exPickItems" style="display:none">';
    for(var e=0;e<exs.length;e++){
      content+='<div class="exPickItem" onclick="pickExerciseForWorkout(\''+esc(grp)+'\',\''+esc(exs[e].replace(/'/g,"\\'"))+'\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--borderS);transition:background .15s" onmouseover="this.style.background=\'var(--accS)\'" onmouseout="this.style.background=\'none\'"><div style="font-size:12px;color:var(--wh)">'+esc(exs[e])+'</div></div>';
    }
    content+='</div></div>';

  content+='</div>';
  content+='<div style="border-top:1px solid var(--borderS);padding-top:12px;margin-top:10px"><div style="font-size:10px;color:var(--dm);font-family:var(--mono);margin-bottom:6px">CUSTOM EXERCISE</div><div style="display:flex;gap:6px"><input id="exCustomName" placeholder="Exercise name" style="flex:1;font-size:12px;padding:8px"><select id="exCustomGroup" style="font-size:11px;padding:8px;width:auto">';
  for(var g2=0;g2<groups.length;g2++)content+='<option>'+groups[g2]+'</option>';
  content+='</select><button class="btn2" onclick="pickWkExCustom()" style="padding:6px 12px;font-size:9px">ADD</button></div></div></div>';

function pickWkExCustom(){var n=val("exCustomName"),g=val("exCustomGroup");if(!n){toast("Enter exercise name");return;}var w=_workouts.find(function(x){return x.id===_editWorkout;});if(!w)return;w.exercises.push({name:n,group:g||"Custom",sets:"",reps:"",rest:"",notes:""});saveWorkouts();closeModal();render();}
function filterExPickerModal(){var q=(el("exPickSearch")||{}).value||"";q=q.toLowerCase();var cats=document.querySelectorAll(".exPickCat");cats.forEach(function(c){var items=c.querySelectorAll(".exPickItem");var anyMatch=false;items.forEach(function(it){var match=it.textContent.toLowerCase().indexOf(q)>=0;it.style.display=match?"":"none";if(match)anyMatch=true;});c.style.display=anyMatch||!q?"":"none";if(q&&anyMatch){var itemsDiv=c.querySelector(".exPickItems");if(itemsDiv)itemsDiv.style.display="block";}});}
function pickExerciseForWorkout(group,name){var w=_workouts.find(function(x){return x.id===_editWorkout;});if(!w)return;w.exercises.push({name:name,group:group,sets:"",reps:"",rest:"",notes:""});saveWorkouts();closeModal();render();}

function pickCardioForWorkout(name){var w=_workouts.find(function(x){return x.id===_editWorkout;});if(!w)return;w.cardio.push({name:name,duration:"",mode:"Steady State",notes:""});saveWorkouts();closeModal();render();}

function generateWorkoutPDF(){
  var w=_workouts.find(function(x){return x.id===_editWorkout;});if(!w||(!w.exercises.length&&!w.cardio.length)){toast("Add exercises first");return;}
  var cl=w.clientId?clientById(w.clientId):null;var accent=_pdfAccent();
  var body='';
  if(w.exercises.length){
    body+='<div style="margin-bottom:22px"><div style="font-size:11px;font-weight:700;color:'+accent+';letter-spacing:.2em;margin-bottom:12px">EXERCISES</div>'
      +'<table style="width:100%;border-collapse:collapse"><tr style="background:'+accent+'18"><th style="padding:7px 12px;text-align:left;color:'+accent+';font-size:9px;letter-spacing:.12em">EXERCISE</th><th style="padding:7px 12px;text-align:center;color:'+accent+';font-size:9px;letter-spacing:.12em">SETS</th><th style="padding:7px 12px;text-align:center;color:'+accent+';font-size:9px;letter-spacing:.12em">REPS</th><th style="padding:7px 12px;text-align:center;color:'+accent+';font-size:9px;letter-spacing:.12em">REST</th><th style="padding:7px 12px;text-align:left;color:'+accent+';font-size:9px;letter-spacing:.12em">NOTES</th></tr>';
    for(var i=0;i<w.exercises.length;i++){var ex=w.exercises[i];
      body+='<tr style="border-bottom:1px solid #161616;background:'+(i%2===0?"#0a0a0a":"#080808")+'"><td style="padding:9px 12px;color:#ddd;font-size:13px;font-weight:500">'+esc(ex.name)+'</td><td style="padding:9px 12px;text-align:center;color:#bbb;font-size:13px;font-family:IBM Plex Mono,monospace">'+(ex.sets||"\u2014")+'</td><td style="padding:9px 12px;text-align:center;color:#bbb;font-size:13px;font-family:IBM Plex Mono,monospace">'+(ex.reps||"\u2014")+'</td><td style="padding:9px 12px;text-align:center;color:#999;font-size:11px;font-family:IBM Plex Mono,monospace">'+(ex.rest?ex.rest+"s":"\u2014")+'</td><td style="padding:9px 12px;color:#888;font-size:11px">'+(ex.notes?esc(ex.notes):"")+'</td></tr>';}
    body+='</table></div>';
  }
  if(w.cardio.length){
    body+='<div style="margin-bottom:22px"><div style="font-size:11px;font-weight:700;color:#5b5;letter-spacing:.2em;margin-bottom:12px">CARDIO</div>';
    for(var j=0;j<w.cardio.length;j++){var cd=w.cardio[j];
      body+='<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #161616;background:'+(j%2===0?"#0a0a0a":"#080808")+'"><span style="color:#ccc;font-size:13px">\u2022 '+esc(cd.name)+'</span><span style="color:#999;font-size:11px;font-family:IBM Plex Mono,monospace">'+(cd.duration?cd.duration+' min':'')+(cd.mode?' \u00b7 '+cd.mode:'')+'</span></div>';}
    body+='</div>';
  }
  if(w.notes)body+='<div style="margin-top:16px;padding:14px;background:#0c0c0c;border:1px solid '+accent+'30;border-radius:6px"><div style="font-size:10px;color:'+accent+';font-family:IBM Plex Mono,monospace;margin-bottom:6px">NOTES</div><div style="font-size:12px;color:#ccc;line-height:1.6">'+esc(w.notes)+'</div></div>';
  var contentPages=_splitContentIntoPages(body);
  var pages=[{coverTitle:"Workout",coverClient:cl?cl.name:"",coverSub:w.name}];
  for(var pi=0;pi<contentPages.length;pi++)pages.push({content:contentPages[pi]});
  _renderPDFToFile(pages,(cl?(cl.name||"Client").replace(/\s+/g,"_")+"_":"")+"Workout","Workout",w.name);
}

function renderAnabolics(){
  if(!clients.length)return'<div class="cd" style="padding:24px;text-align:center;color:var(--dm)">Add a client first</div>';
  if(!_nutClientId)_nutClientId=clients[0].id;
  var cl=clientById(_nutClientId);
  var html='';
  if(!_inProgramBuilder){html+='<div style="margin-bottom:12px"><select onchange="_nutClientId=this.value;render()" style="font-size:12px">';
  for(var i=0;i<clients.length;i++)html+='<option value="'+clients[i].id+'"'+(_nutClientId===clients[i].id?" selected":"")+'>'+esc(clients[i].name)+'</option>';
  html+='</select></div>';}
  if(!cl)return html+'<div class="cd" style="padding:20px;text-align:center;color:var(--dm)">Select a client</div>';
  if(!cl.anabolics)cl.anabolics=[];
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="sl" style="margin:0">PED PROTOCOL</span><div style="display:flex;gap:4px"><button class="btn2" onclick="addAnabolic()" style="padding:6px 12px;font-size:9px">+ ADD</button>'+(cl.anabolics.length?'<button class="btn2" onclick="openPDFFromAnabolics()" style="padding:6px 12px;font-size:9px">PDF</button>':'')+'</div></div>';
  if(!cl.anabolics.length)return html+'<div class="cd" style="padding:20px;text-align:center;border:1px dashed var(--border)"><div style="color:var(--dm);font-size:11px;margin-bottom:8px">No protocol yet</div><div style="font-size:9px;color:var(--dmL);font-family:var(--mono);margin-bottom:10px">Tap + ADD to create a protocol</div><button class="btn2" onclick="addAnabolic()" style="padding:6px 14px;font-size:9px">+ ADD COMPOUND</button></div>';
  // Group by category
  var grouped={};cl.anabolics.forEach(function(a,idx){
    var cat=a.cat||"Uncategorized";if(!grouped[cat])grouped[cat]=[];grouped[cat].push({item:a,idx:idx});
  });
  var catOrder=["Anabolic Steroids","AI / Aromatase Inhibitors","SERMs","Prolactin / Progesterone Support","Peptides","SARMs","Fat Loss / GLPs","Ancillaries & Health","Uncategorized"];
  var _anaFirst=true;
  for(var ci2=0;ci2<catOrder.length;ci2++){
    var catName=catOrder[ci2];if(!grouped[catName])continue;
    html+='<div style="font-size:9px;color:var(--acc);font-family:var(--mono);letter-spacing:.1em;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--borderS)">'+catName.toUpperCase()+'</div>';
    grouped[catName].forEach(function(entry,ei){var a=entry.item,idx=entry.idx;
      var hint=_anaFirst?'<div style="font-size:7px;color:var(--dmL);font-family:var(--mono);margin-top:2px;letter-spacing:.06em">TAP TO EDIT</div>':'';_anaFirst=false;
      html+='<div class="cd" style="display:flex;align-items:center;gap:10px;padding:12px 14px"><div style="flex:1;cursor:pointer" onclick="editAnabolic('+idx+')"><div style="font-size:13px;font-weight:500;color:var(--wh)">'+esc(a.name)+'</div><div style="font-size:10px;color:var(--dm);font-family:var(--mono)">'+esc(a.dose||"")+' \u00b7 '+esc(a.freq||"")+' \u00b7 '+esc(a.route||"")+'</div>'+(a.notes?'<div style="font-size:9px;color:var(--mu);margin-top:2px">'+esc(a.notes)+'</div>':'')+hint+'</div><span style="font-size:12px;color:var(--danger);cursor:pointer;padding:2px 6px" onclick="rmAnabolic('+idx+')">\u2715</span></div>';
    });
  }
  // Notes
  html+='<div style="margin-top:14px"><span class="lb">PROTOCOL NOTES</span><textarea rows="2" style="width:100%;box-sizing:border-box;font-size:11px;resize:vertical" placeholder="Cycle notes, bloodwork schedule, etc." onchange="setAnabolicNotes(this.value)">'+(cl.anabolicNotes?esc(cl.anabolicNotes):"")+'</textarea></div>';
  return html;
}
function addAnabolic(){showAnabolicPicker();}
function rmAnabolic(i){var cl=clientById(_nutClientId);if(!cl||!cl.anabolics)return;cl.anabolics.splice(i,1);save();rerender();}
function editAnabolic(idx){
  var cl=clientById(_nutClientId);if(!cl||!cl.anabolics||!cl.anabolics[idx])return;
  var a=cl.anabolics[idx];
  var content='<div>';
  content+='<div class="field"><span class="lb">DOSE</span><input id="editAnaDose" value="'+esc(a.dose||'')+'" placeholder="e.g. 500mg" style="font-size:13px"></div>';
  content+='<div class="field"><span class="lb">FREQUENCY</span><input id="editAnaFreq" value="'+esc(a.freq||'')+'" placeholder="e.g. 2x/week" style="font-size:13px"></div>';
  content+='<div class="field"><span class="lb">ROUTE</span><input id="editAnaRoute" value="'+esc(a.route||'')+'" placeholder="e.g. IM injection" style="font-size:13px"></div>';
  content+='<div class="field"><span class="lb">NOTES</span><input id="editAnaNotes" value="'+esc(a.notes||'')+'" placeholder="Optional notes" style="font-size:13px"></div>';
  content+='<button class="btn" onclick="saveEditAnabolic('+idx+')" style="width:100%;margin-top:8px">UPDATE</button>';
  content+='</div>';
  showModal("EDIT \u2014 "+esc(a.name),content);
}
function saveEditAnabolic(idx){
  var cl=clientById(_nutClientId);if(!cl||!cl.anabolics||!cl.anabolics[idx])return;
  cl.anabolics[idx].dose=val("editAnaDose");
  cl.anabolics[idx].freq=val("editAnaFreq");
  cl.anabolics[idx].route=val("editAnaRoute");
  cl.anabolics[idx].notes=val("editAnaNotes");
  save();closeModal();render();toast("\u2713 Updated");
}
function setAnabolicNotes(v){var cl=clientById(_nutClientId);if(!cl)return;cl.anabolicNotes=v;save();}

function filterAnaPicker(){var q=(el("anaPickSearch")||{}).value||"";q=q.toLowerCase();var cats=document.querySelectorAll(".anaPickCat");cats.forEach(function(c){var items=c.querySelectorAll(".anaPickItem");var anyMatch=false;items.forEach(function(it){var match=it.textContent.toLowerCase().indexOf(q)>=0;it.style.display=match?"":"none";if(match)anyMatch=true;});c.style.display=anyMatch||!q?"":"none";if(q&&anyMatch){var itemsDiv=c.querySelector(".anaPickItems");if(itemsDiv)itemsDiv.style.display="block";}});}

function confirmAnabolic(name,cat){
  var dose=val("anaDose"),freq=val("anaFreq"),route=val("anaRoute"),notes=val("anaNotes")||"";
  var cl=clientById(_nutClientId);if(!cl)return;if(!cl.anabolics)cl.anabolics=[];
  cl.anabolics.push({name:name,dose:dose,freq:freq,route:route,notes:notes,cat:cat});
  save();notifyClientProgramUpdate(cl);closeModal();render();toast("\u2713 Added "+name);
}
function pickAnaCustom(){
  var n=val("anaCustomN"),d=val("anaCustomD")||"",f=val("anaCustomF")||"",r=val("anaCustomR")||"",cat=val("anaCustomCat")||"Uncategorized";
  if(!n){toast("Enter compound name");return;}

  cl.anabolics.push({name:n,dose:d,freq:f,route:r,notes:"",cat:cat});
  save();notifyClientProgramUpdate(cl);closeModal();render();toast("\u2713 Added "+n);

function generateAnabolicsPDF(){
  var cl=clientById(_nutClientId);if(!cl||!cl.anabolics||!cl.anabolics.length){toast("No protocol to export");return;}
  var accent=_pdfAccent();
  var grouped={};cl.anabolics.forEach(function(a){var cat=a.cat||"Uncategorized";if(!grouped[cat])grouped[cat]=[];grouped[cat].push(a);});

      body+='<tr style="border-bottom:1px solid #1a1a1a;background:'+(j%2===0?"#0a0a0a":"#080808")+'"><td style="padding:8px 10px;color:#ddd;font-size:12px;font-weight:500">'+esc(a.name)+'</td><td style="padding:8px 10px;text-align:center;color:#bbb;font-size:12px;font-family:IBM Plex Mono,monospace">'+esc(a.dose)+'</td><td style="padding:8px 10px;text-align:center;color:#bbb;font-size:11px;font-family:IBM Plex Mono,monospace">'+esc(a.freq)+'</td><td style="padding:8px 10px;color:#aaa;font-size:11px">'+esc(a.route)+'</td></tr>';}

/* Focus trap helper for modals (Agent 5 P1). Returns a cleanup fn.
   Keeps Tab / Shift+Tab cycling inside the container, focuses the
   first focusable element on install, and restores focus to the
   previously-active element on cleanup. */
function _installFocusTrap(container,onEsc){
  var prevFocus=document.activeElement;
  function getFocusable(){
    return Array.prototype.slice.call(container.querySelectorAll('a[href],button:not([disabled]),textarea:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(function(el){return el.offsetParent!==null;});
  }
  function handler(e){
    if(e.key==="Escape"&&onEsc){e.preventDefault();onEsc();return;}
    if(e.key!=="Tab")return;
    var focusable=getFocusable();
    if(!focusable.length)return;
    var first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
  document.addEventListener("keydown",handler);
  /* Focus first focusable after a tick so the modal's DOM is painted */
  setTimeout(function(){var f=getFocusable();if(f.length)f[0].focus();},50);
  return function cleanup(){
    document.removeEventListener("keydown",handler);
    try{if(prevFocus&&prevFocus.focus)prevFocus.focus();}catch(e){}
  };
}

function requestNotifPermission(){

  if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){

  }

     (the system prompt didn't fire or was auto-blocked by the browser) */
  if(Notification.permission==="denied"&&!LS.get("notif_prompted",false)){
    _showNotifGuide();return;

  if(Notification.permission==="granted"){subscribeToPush();return;}
  /* Default state — try the system prompt */
  LS.set("notif_prompted",true);

        render();
        return;
      }
      /* Create new subscription */
      var keyBytes=_urlBase64ToUint8Array(vapidKey);
      reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes}).then(function(sub){
        _pushSubscription=sub;
        _storePushSubscription(sub);
        toast("\u2713 Push notifications enabled!");
        render();
      }).catch(function(err){
        if(Notification.permission==="denied"){toast("Notifications blocked in browser settings");}
        else{toast("Push setup failed — try again");console.warn("Push subscribe error:",err);}
      });
    });
  });
}
function _storePushSubscription(sub){
  var sb=getSupabase();if(!sb)return;
  var subJSON=sub.toJSON();
  sb.from("app_settings").upsert({
    key:"push_subscription",
    value:{endpoint:subJSON.endpoint,keys:subJSON.keys,created:new Date().toISOString(),userAgent:navigator.userAgent}
  },{onConflict:"key"}).then(function(res){
    if(res.error)console.warn("Failed to store push subscription:",res.error.message);
  }).catch(function(e){console.warn("Push sub upsert rejected:",e);});
}
function _urlBase64ToUint8Array(base64String){
  var padding="=".repeat((4-base64String.length%4)%4);
  var base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(base64);var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}

}

function checkBrowserNotifications(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  if(!LS.get("notif_schedule",true))return;
  var now=new Date(),today=todayISO();
  var leadMin=parseInt(LS.get("reminderMin","30"))||30;
  var notified=LS.get("notif_sent_"+today,{});
  var upcoming=schedule.filter(function(s){
    if(s.date!==today||s.status==="complete"||s.status==="cancelled")return false;
    if(!s.time||notified[s.id])return false;
    var parts=(s.time||"").split(":");if(parts.length<2)return false;
    var sessTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parseInt(parts[0])||0,parseInt(parts[1])||0);
    var diff=(sessTime-now)/(1000*60);
    return diff>0&&diff<=leadMin;
  });
  upcoming.forEach(function(s){
    var cl=clientById(s.clientId);
    var clientName=cl?cl.name:s.clientName||"Client";
    var title=(s.type||"Training")+" Session";
    var body2=clientName+" at "+fmtTimeStr(s.time)+(s.rate?" \u00b7 $"+s.rate:"");
    try{
      var n=new Notification(title,{body:body2,icon:window._themeIcons&&window._themeIcons[192]?window._themeIcons[192]:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"session-"+s.id,requireInteraction:true});
      n.onclick=function(){window.focus();};
    }catch(e){}
    notified[s.id]=true;
    LS.set("notif_sent_"+today,notified);
  });
}

function galleryReplacePhoto(idx){
  if(_galUploadLock)return;
  window._galReplaceIdx=idx;
  var inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=function(evt){
    var file=evt.target.files[0];if(!file)return;
    if(!file.type.startsWith("image/")){toast("Only image files");return;}

    var sb=getSupabase();if(!sb){toast("Configure Supabase first");return;}
    _galUploadLock=true;_galShowLoading("REPLACING PHOTO");

    sb.storage.from("gallery").upload(path,file,{cacheControl:"3600",upsert:false}).then(function(res){
      _galUploadLock=false;_galHideLoading();
      if(res.error){toast("\u2717 Upload failed: "+res.error.message);return;}
      var publicUrl=sb.storage.from("gallery").getPublicUrl(path).data.publicUrl;
      if(!publicUrl||!publicUrl.startsWith('http')){toast("Upload error");return;}
      var old=_galleryPhotos[window._galReplaceIdx];
      if(old&&old.url){var m=old.url.match(/gallery\/(.+)$/);if(m)sb.storage.from("gallery").remove([m[1]]).catch(function(){});}
      _galleryPhotos[window._galReplaceIdx].url=publicUrl;

    }).catch(function(e){
      _galUploadLock=false;_galHideLoading();
      console.warn("Gallery replace failed:",e);

function galleryMovePhoto(idx,dir){
  var target=idx+dir;

function galleryDrop(idx){
  if(_galleryDragFrom<0||_galleryDragFrom===idx)return;
  var item=_galleryPhotos.splice(_galleryDragFrom,1)[0];

function removeGalleryPhoto(idx){

function applyTheme(){var t=LS.get("theme","crimson");if(t==="crimson")document.body.classList.add("theme-crimson");else document.body.classList.remove("theme-crimson");var mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=t==="crimson"?"#1a0808":"#1a1408";generateThemeIcon(t);}
function generateThemeIcon(theme){
  try{
    var sizes=[120,152,180,192,512];
    var isCrimson=theme==="crimson";
    var accentColor=isCrimson?"#D03030":"#D4A830";
    var gradStops=isCrimson?[["0","#8B1414"],["0.3","#C42828"],["0.5","#E84040"],["0.7","#C42828"],["1","#8B1414"]]:[["0","#8B6914"],["0.3","#C49628"],["0.5","#E8C050"],["0.7","#C49628"],["1","#8B6914"]];
    for(var si=0;si<sizes.length;si++){
      (function(size){
        var cv=document.createElement("canvas");cv.width=size;cv.height=size;
        var ctx=cv.getContext("2d");
        // Background
        ctx.fillStyle="#060608";ctx.fillRect(0,0,size,size);
        // Inner glow
        var glow=ctx.createRadialGradient(size/2,size/2,size*0.1,size/2,size/2,size*0.6);
        glow.addColorStop(0,accentColor+"18");glow.addColorStop(1,"transparent");
        ctx.fillStyle=glow;ctx.fillRect(0,0,size,size);
        // M letter with gradient
        var grad=ctx.createLinearGradient(size*0.25,size*0.2,size*0.75,size*0.8);
        for(var g=0;g<gradStops.length;g++)grad.addColorStop(parseFloat(gradStops[g][0]),gradStops[g][1]);
        ctx.fillStyle=grad;
        ctx.font="900 "+Math.round(size*0.52)+"px Cinzel,serif";
        ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.shadowColor=accentColor+"60";ctx.shadowBlur=size*0.08;
        ctx.fillText("M",size/2,size*0.48);
        ctx.shadowBlur=0;
        // Accent line
        var lineW=size*0.3;
        ctx.fillStyle=accentColor+"50";
        ctx.fillRect(size/2-lineW/2,size*0.72,lineW,size*0.008);
        var url=cv.toDataURL("image/png");
        // Update link elements
        var links=document.querySelectorAll('link[rel*="icon"][sizes="'+size+'x'+size+'"],link[rel="apple-touch-icon"][sizes="'+size+'x'+size+'"]');
        links.forEach(function(l){l.href=url;});
        if(size===180){var atLinks=document.querySelectorAll('link[rel="apple-touch-icon"]:not([sizes])');atLinks.forEach(function(l){l.href=url;});}
        // Store for manifest update
        if(!window._themeIcons)window._themeIcons={};
        window._themeIcons[size]=url;
      })(sizes[si]);
    }
    // Update manifest dynamically for PWA
    _updateManifestIcons();
  }catch(e){/* font may not load for canvas, graceful fallback */}
}
function _updateManifestIcons(){
  try{
    if(!window._themeIcons)return;
    var icons=[];
    var sizes2=[192,512];
    for(var i=0;i<sizes2.length;i++){
      var s=sizes2[i];
      if(window._themeIcons[s]){
        icons.push({src:window._themeIcons[s],sizes:s+"x"+s,type:"image/png",purpose:"any"});
        icons.push({src:window._themeIcons[s],sizes:s+"x"+s,type:"image/png",purpose:"maskable"});
      }
    }
    // Previously this swapped the manifest <link> to a blob: URL carrying
    // canvas-generated theme icons. A blob: manifest's start_url is not
    // same-origin with the document, so Chrome/Android rejected the manifest
    // and the install prompt / home-screen icon would not fire. We now keep
    // the static, subpath-relative manifest.json; theme-color is set in
    // applyTheme(), and the static icon set (icons/*.png) is used for install.
  }catch(e){}
}

function _loadPDFLibs(cb){
  var needed=[];
  if(!window.jspdf||!window.jspdf.jsPDF)needed.push("assets/vendor/jspdf.umd.min.js");
  if(!window.html2canvas)needed.push("assets/vendor/html2canvas.min.js");
  if(!needed.length){cb();return;}
  toast("Loading PDF engine...");
  var loaded=0;
  var failed=false;needed.forEach(function(src){var s=document.createElement("script");s.src=src;s.onload=function(){if(failed)return;loaded++;if(loaded===needed.length)cb();};s.onerror=function(){if(failed)return;failed=true;toast("\u26a0 Could not load PDF library. Check internet connection.",4000);};document.head.appendChild(s);});
}
function _sanitizeFilename(name){return(name||"document").replace(/[\/\\:*?"<>|]/g,"_").replace(/\s+/g,"_").substring(0,80);}
function _renderPDFToFile(pages,filename,docType,pageLabel,overrideAccent,overrideRGB){
  if(!window.jspdf||!window.jspdf.jsPDF||!window.html2canvas){_loadPDFLibs(function(){_renderPDFToFile(pages,filename,docType,pageLabel,overrideAccent,overrideRGB);});return;}
  filename=_sanitizeFilename(filename);
  if(!pages||!pages.length){toast("No content to generate PDF");return;}
  var _pdfLoading=document.createElement('div');
  _pdfLoading.id='pdfLoadingOverlay';
  _pdfLoading.style.cssText='position:fixed;inset:0;z-index:9000;background:rgba(2,2,4,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px';
  _pdfLoading.innerHTML='<div style="font-family:var(--display);font-size:28px;font-weight:900"><span style="background:var(--goldGrad);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 4s ease-in-out infinite">M</span></div><div style="font-size:11px;color:var(--acc);font-family:var(--mono);letter-spacing:.2em">GENERATING PDF...</div><div style="width:200px;height:3px;background:var(--borderS);border-radius:2px;overflow:hidden"><div style="width:30%;height:100%;background:var(--acc);border-radius:2px;animation:shimmer 2s ease-in-out infinite"></div></div>';
  document.body.appendChild(_pdfLoading);
  var accent=overrideAccent||_pdfAccent(),rgb=overrideRGB||_pdfAccentRGB();
  var container=document.createElement("div");
  container.id="_pdfRender";
  container.style.cssText="position:fixed;left:-9999px;top:0;z-index:-1;";
  document.body.appendChild(container);
  var allHTML='';
  for(var i=0;i<pages.length;i++){
    allHTML+='<div class="_pdfPage" style="width:816px;height:1056px;overflow:hidden;margin-bottom:4px;font-family:Rajdhani,sans-serif">';
    if(i===0)allHTML+=_pdfCoverPage(accent,rgb,pages[i].coverTitle||docType,pages[i].coverClient||"",pages[i].coverSub||"");
    else allHTML+=_pdfContentPage(accent,rgb,pages[i].content||"",docType,pageLabel||"");
    allHTML+='</div>';
  }
  container.innerHTML=allHTML;
  var pageEls=container.querySelectorAll("._pdfPage");
  var jsPDF=window.jspdf.jsPDF;
  var pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"letter"});
  var done=0;
  function capturePage(idx){
    html2canvas(pageEls[idx],{backgroundColor:"#060606",scale:2,useCORS:true,logging:false}).then(function(canvas){
      var imgData=canvas.toDataURL("image/jpeg",0.95);
      if(idx>0)pdf.addPage("letter","portrait");
      pdf.addImage(imgData,"JPEG",0,0,612,792);
      done++;
      if(done<pageEls.length)capturePage(idx+1);
      else{
        var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&'ontouchend' in document);
        if(isIOS){
          var blob=pdf.output('blob');
          var blobUrl=URL.createObjectURL(blob);
          var win=window.open(blobUrl,'_blank');
          if(!win){
            var a=document.createElement('a');
            a.href=blobUrl;a.download=filename+'.pdf';a.style.display='none';
            document.body.appendChild(a);a.click();
            setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(blobUrl);},1000);
          }
        }else{
          pdf.save(filename+".pdf");
        }
        container.remove();
        var _lo=document.getElementById('pdfLoadingOverlay');if(_lo)_lo.remove();
        toast("\u2713 PDF saved: "+filename+".pdf");
      }
    }).catch(function(e){console.error("PDF error:",e);container.remove();var _lo=document.getElementById('pdfLoadingOverlay');if(_lo)_lo.remove();toast("\u2717 PDF generation failed");});
  }
  var startCapture=function(){capturePage(0);};if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setTimeout(startCapture,100);});else setTimeout(startCapture,300);
}

function _splitContentIntoPages(sectionsHTML,maxH){
  if(!sectionsHTML)return[];
  maxH=maxH||920;
  var temp=document.createElement("div");
  temp.style.cssText="position:fixed;left:-9999px;top:0;width:760px;font-family:Rajdhani,sans-serif;font-size:13px;color:#ddd;line-height:1.5";
  temp.innerHTML=sectionsHTML;
  document.body.appendChild(temp);
  var pages=[];var currentHTML="";var currentH=0;
  var children=temp.children;
  for(var i=0;i<children.length;i++){
    var ch=children[i].offsetHeight+16;
    if(currentH+ch>maxH&&currentHTML){pages.push(currentHTML);currentHTML="";currentH=0;}
    currentHTML+=children[i].outerHTML;currentH+=ch;
  }
  if(currentHTML)pages.push(currentHTML);
  temp.remove();
  return pages;
}

function pdfOrderMove(key,dir){
  var list=document.getElementById("pdfOrderList");if(!list)return;
  var items=Array.from(list.children);
  var idx=-1;for(var i=0;i<items.length;i++){if(items[i].dataset.sec===key){idx=i;break;}}
  if(idx<0)return;

      +'<div style="width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:0 auto 14px"></div>'
      +'<div style="font-size:13px;color:var(--ow);line-height:1.7;margin-bottom:28px;white-space:pre-line">'+s.body+'</div>'

      +'<div style="display:flex;gap:10px;justify-content:center">'
      +(!isFirst?'<button class="btn2" onclick="_tutStep--;renderTutStep()" style="min-width:90px;padding:12px 18px">BACK</button>':'')
      +(isLast?'<button class="btn" onclick="finishTutorial()" style="min-width:140px;padding:14px 28px">LET\'S GO</button>':'<button class="btn" onclick="_tutStep++;renderTutStep()" style="min-width:140px;padding:14px 28px">NEXT</button>')

      +'</div>'
      +'<div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)"></div>';
  };
  renderTutStep();
}

  +'<div style="font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:rgba(220,200,140,.45);margin-bottom:18px;text-transform:uppercase;max-width:100%;white-space:nowrap;text-align:center">IFBB Pro &middot; 2\u00d7 World Champion &middot; Since 1996</div>'
  +'<div aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;max-width:220px;width:100%"><div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,'+GOLD_HAIR+')"></div><div style="width:5px;height:5px;background:'+GOLD_BRIGHT+';transform:rotate(45deg);opacity:.7"></div><div style="flex:1;height:1px;background:linear-gradient(90deg,'+GOLD_HAIR+',transparent)"></div></div>'

/* Coach UID gate (subagent P0 #7 hardening).
   The previous implementation trusted whichever UID was first seen
   on this device by writing it to localStorage and checking against
   that. An attacker on a fresh device could sign up for any
   Supabase account, become the "first" UID, and own the coach
   surface. Now we require an allowlist baked into the source. The
   deployer MUST set BIG_MIKE_COACH_UID to Mike's real Supabase UID
   before shipping; until then we fall back to the trust-on-first-use
   behavior but flag it loudly in the console. */
var BIG_MIKE_COACH_UID="";  /* TODO deployer: paste real UID here before ship */
function _verifyCoachUID(uid){
  if(BIG_MIKE_COACH_UID){
    return uid===BIG_MIKE_COACH_UID;
  }
  /* Fallback (NOT for production) — TOFU stored in LS */
  console.warn("[security] BIG_MIKE_COACH_UID not set \u2014 using trust-on-first-use fallback. Set this constant before production.");
  var stored=localStorage.getItem("fm_coach_uid");
  if(!stored){localStorage.setItem("fm_coach_uid",uid);return true;}
  return stored===uid;
}
function doAuthLogin(){
  var email=val("authEmail"),pass=val("authPass");
  if(!email||!pass){el("authError").textContent="Enter email and password";return;}
  var btn=el("authBtn");btn.textContent="SIGNING IN...";btn.disabled=true;
  var sb=getSupabase();
  if(!sb){el("authError").textContent="Connection error";btn.textContent="SIGN IN";btn.disabled=false;return;}
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
    if(res.error){el("authError").textContent=res.error.message||"Login failed";btn.textContent="SIGN IN";btn.disabled=false;return;}
    if(!_verifyCoachUID(res.data.user.id)){sb.auth.signOut();el("authError").textContent="Unauthorized account";btn.textContent="SIGN IN";btn.disabled=false;return;}
    var as=el("authScreen");if(as)as.remove();
    showLockScreen();
  }).catch(function(e){
    /* Network failure mid-request would otherwise leave the button
       stuck on "SIGNING IN..." and the user unable to retry. */
    console.warn("Auth signIn failed:",e);
    var errEl=el("authError");if(errEl)errEl.textContent="Network error \u2014 please try again";
    btn.textContent="SIGN IN";btn.disabled=false;
  });
}
function checkSupabaseAuth(callback){
  var sb=getSupabase();
  if(!sb){callback(false);return;}
  sb.auth.getSession().then(function(res){
    if(res.data&&res.data.session){
      if(!_verifyCoachUID(res.data.session.user.id)){sb.auth.signOut();callback(false);return;}
      callback(true);return;
    }
    // Session not in memory — try refreshing from stored refresh token
    sb.auth.refreshSession().then(function(ref){
      if(ref.data&&ref.data.session){
        if(!_verifyCoachUID(ref.data.session.user.id)){sb.auth.signOut();callback(false);return;}
        callback(true);
      }
      else{callback(false);}
    }).catch(function(){callback(false);});
  }).catch(function(){callback(false);});
}
function dismissBdayMsg(){checkSupabaseAuth(function(authed){if(authed)showLockScreen();else showAuthScreen();});}

})();
